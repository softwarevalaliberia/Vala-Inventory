<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Management - Software Vala Inventory</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">📦 Software Vala Inventory</div>
    <div class="nav-links">
      <div class="user-info">
        <span>Welcome, <strong id="userName">User</strong></span>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <ul class="sidebar-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="admin-management.html" class="active">Admin Management</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <div class="header">
        <h1>User & Admin Management</h1>
        <button class="btn" onclick="openCreateAdminModal()" id="createAdminBtn" style="display: none;">+ Create Admin</button>
      </div>

      <div id="alertContainer"></div>

      <!-- Users Table -->
      <div class="card">
        <h3>All Users</h3>
        <div class="table-container" id="usersTable">
          <p style="text-align: center; padding: 2rem;">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Admin Modal -->
  <div id="createAdminModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Admin</h2>
        <button class="close-btn" onclick="UIManager.hideModal('createAdminModal')">&times;</button>
      </div>

      <form id="createAdminForm">
        <div class="form-row">
          <div class="form-group">
            <label for="adminName">Full Name *</label>
            <input type="text" id="adminName" name="name" required>
          </div>
          <div class="form-group">
            <label for="adminEmail">Email *</label>
            <input type="email" id="adminEmail" name="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="adminPassword">Password *</label>
            <input type="password" id="adminPassword" name="password" required>
          </div>
          <div class="form-group">
            <label for="adminPhone">Phone</label>
            <input type="tel" id="adminPhone" name="phone">
          </div>
        </div>

        <div class="form-group">
          <label for="adminAddress">Address</label>
          <input type="text" id="adminAddress" name="address">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="adminCity">City</label>
            <input type="text" id="adminCity" name="city">
          </div>
          <div class="form-group">
            <label for="adminState">State</label>
            <input type="text" id="adminState" name="state">
          </div>
          <div class="form-group">
            <label for="adminCountry">Country</label>
            <input type="text" id="adminCountry" name="country">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="UIManager.hideModal('createAdminModal')">Cancel</button>
          <button type="submit" class="btn">Create Admin</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editUserModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit User</h2>
        <button class="close-btn" onclick="UIManager.hideModal('editUserModal')">&times;</button>
      </div>

      <form id="editUserForm">
        <input type="hidden" id="editUserId">

        <div class="form-row">
          <div class="form-group">
            <label for="editName">Full Name</label>
            <input type="text" id="editName" name="name">
          </div>
          <div class="form-group">
            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" name="email">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editPhone">Phone</label>
            <input type="tel" id="editPhone" name="phone">
          </div>
          <div class="form-group">
            <label for="editStatus">Status</label>
            <select id="editStatus" name="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="editAddress">Address</label>
          <input type="text" id="editAddress" name="address">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="editCity">City</label>
            <input type="text" id="editCity" name="city">
          </div>
          <div class="form-group">
            <label for="editState">State</label>
            <input type="text" id="editState" name="state">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="UIManager.hideModal('editUserModal')">Cancel</button>
          <button type="submit" class="btn">Update User</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentEditUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = AuthManager.getUser();
      document.getElementById('userName').textContent = user?.name || 'User';

      // Only superadmin can create admins
      if (AuthManager.isSuperAdmin()) {
        document.getElementById('createAdminBtn').style.display = 'block';
      }

      await loadUsers();
    });

    async function loadUsers() {
      UIManager.showLoading('usersTable');
      try {
        const response = await apiService.getAllUsers();

        if (response.success && response.users.length > 0) {
          let html = '<table><thead><tr>';
          html += '<th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Phone</th><th>Created At</th>';

          if (AuthManager.canManageUsers()) {
            html += '<th>Actions</th>';
          }

          html += '</tr></thead><tbody>';

          response.users.forEach((user) => {
            html += `
              <tr>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td><strong>${user.role}</strong></td>
                <td>
                  <span style="padding: 4px 8px; border-radius: 4px; background-color: ${user.status === 'active' ? '#d4edda' : '#f8d7da'}; color: ${user.status === 'active' ? '#155724' : '#721c24'};">
                    ${user.status}
                  </span>
                </td>
                <td>${user.phone || '-'}</td>
                <td>${UIManager.formatDate(user.createdAt)}</td>
            `;

            if (AuthManager.canManageUsers()) {
              html += `
                <td>
                  <div class="action-buttons">
                    <button class="btn-sm" onclick="editUser('${user._id}')">Edit</button>
                    ${AuthManager.isSuperAdmin() ? `<button class="btn-sm btn-danger" onclick="deleteUser('${user._id}')">Delete</button>` : ''}
                  </div>
                </td>
              `;
            }

            html += '</tr>';
          });

          html += '</tbody></table>';
          document.getElementById('usersTable').innerHTML = html;
        } else {
          document.getElementById('usersTable').innerHTML =
            '<p style="text-align: center; padding: 2rem;">No users found</p>';
        }
      } catch (error) {
        UIManager.showAlert('Failed to load users', 'danger');
      }
    }

    function openCreateAdminModal() {
      UIManager.clearForm('createAdminForm');
      UIManager.showModal('createAdminModal');
    }

    document.getElementById('createAdminForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = UIManager.getFormData('createAdminForm');

      try {
        const response = await apiService.createAdmin(formData);

        if (response.success) {
          UIManager.showAlert('Admin created successfully', 'success');
          UIManager.hideModal('createAdminModal');
          await loadUsers();
        }
      } catch (error) {
        UIManager.showAlert(error.message || 'Failed to create admin', 'danger');
      }
    });

    async function editUser(userId) {
      try {
        const response = await apiService.getUserById(userId);

        if (response.success) {
          const user = response.user;
          currentEditUserId = userId;

          document.getElementById('editUserId').value = userId;
          document.getElementById('editName').value = user.name;
          document.getElementById('editEmail').value = user.email;
          document.getElementById('editPhone').value = user.phone || '';
          document.getElementById('editStatus').value = user.status;
          document.getElementById('editAddress').value = user.address || '';
          document.getElementById('editCity').value = user.city || '';
          document.getElementById('editState').value = user.state || '';

          UIManager.showModal('editUserModal');
        }
      } catch (error) {
        UIManager.showAlert('Failed to load user details', 'danger');
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Are you sure you want to delete this user?')) return;

      try {
        const response = await apiService.deleteUser(userId);

        if (response.success) {
          UIManager.showAlert('User deleted successfully', 'success');
          await loadUsers();
        }
      } catch (error) {
        UIManager.showAlert(error.message || 'Failed to delete user', 'danger');
      }
    }

    document.getElementById('editUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = UIManager.getFormData('editUserForm');
      const userId = document.getElementById('editUserId').value;

      try {
        const response = await apiService.updateUser(userId, {
          name: formData.name,
          email: formData.email,
          phone: formData.phone,
          status: formData.status,
          address: formData.address,
          city: formData.city,
          state: formData.state,
        });

        if (response.success) {
          UIManager.showAlert('User updated successfully', 'success');
          UIManager.hideModal('editUserModal');
          await loadUsers();
        }
      } catch (error) {
        UIManager.showAlert(error.message || 'Failed to update user', 'danger');
      }
    });

    function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        AuthManager.logout();
      }
    }
  </script>
</body>
</html>
