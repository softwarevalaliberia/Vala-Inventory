<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Software Vala Inventory</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">📦 Software Vala Inventory</div>
    <div class="nav-links">
      <div class="user-info">
        <span>Welcome, <strong id="userName">User</strong></span>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <ul class="sidebar-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="products.html" class="active">Products</a></li>
      <li><a href="inventory.html">Inventory</a></li>
      <li><a href="admin-management.html" id="adminLink" style="display: none;">Admin Management</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <div class="header">
        <h1>Product Management</h1>
        <button class="btn" onclick="openAddProductModal()" id="addProductBtn" style="display: none;">+ Add Product</button>
      </div>

      <div id="alertContainer"></div>

      <!-- Products Table -->
      <div class="card">
        <h3>All Products</h3>
        <div class="table-container" id="productsTable">
          <p style="text-align: center; padding: 2rem;">Loading...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Product Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Product</h2>
        <button class="close-btn" onclick="UIManager.hideModal('productModal')">&times;</button>
      </div>

      <form id="productForm">
        <div class="form-row">
          <div class="form-group">
            <label for="productName">Product Name *</label>
            <input type="text" id="productName" name="productName" required>
          </div>
          <div class="form-group">
            <label for="productCode">Product Code *</label>
            <input type="text" id="productCode" name="productCode" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category *</label>
            <input type="text" id="category" name="category" required>
          </div>
          <div class="form-group">
            <label for="unit">Unit</label>
            <input type="text" id="unit" name="unit" value="pcs">
          </div>
        </div>

        <div class="form-group form-row.full">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="purchasePrice">Purchase Price *</label>
            <input type="number" id="purchasePrice" name="purchasePrice" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="sellingPrice">Selling Price *</label>
            <input type="number" id="sellingPrice" name="sellingPrice" step="0.01" required>
          </div>
        </div>

        <div class="form-group">
          <label for="minStock">Minimum Stock Level</label>
          <input type="number" id="minStock" name="minStock" value="10" min="0">
        </div>

        <div class="form-group form-row">
          <div>
            <label for="supplierName">Supplier Name</label>
            <input type="text" id="supplierName" name="supplierName">
          </div>
          <div>
            <label for="supplierEmail">Supplier Email</label>
            <input type="email" id="supplierEmail" name="supplierEmail">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="UIManager.hideModal('productModal')">Cancel</button>
          <button type="submit" class="btn">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentEditProductId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = AuthManager.getUser();
      document.getElementById('userName').textContent = user?.name || 'User';

      // Show admin management link
      if (AuthManager.canManageUsers()) {
        document.getElementById('adminLink').style.display = 'block';
      }

      // Show add button for admins
      if (AuthManager.canManageUsers()) {
        document.getElementById('addProductBtn').style.display = 'block';
      }

      await loadProducts();
    });

    async function loadProducts() {
      UIManager.showLoading('productsTable');
      try {
        const response = await apiService.getAllProducts();

        if (response.success && response.products.length > 0) {
          const columns = [
            { key: 'productName', label: 'Product' },
            { key: 'productCode', label: 'Code' },
            { key: 'category', label: 'Category' },
            { key: 'currentStock', label: 'Stock' },
            { key: 'purchasePrice', label: 'Purchase Price' },
            { key: 'sellingPrice', label: 'Selling Price' },
            { key: 'status', label: 'Status' },
          ];

          let html = UIManager.createTable(response.products, columns);

          if (AuthManager.canManageUsers()) {
            html = html.replace('</tbody></table>', '');
            html = html.replace('</tr>', '</tr>');

            let tbody = '<tbody>';
            response.products.forEach((product) => {
              tbody += `
                <tr>
                  <td>${product.productName}</td>
                  <td>${product.productCode}</td>
                  <td>${product.category}</td>
                  <td>${product.currentStock}</td>
                  <td>${UIManager.formatCurrency(product.purchasePrice)}</td>
                  <td>${UIManager.formatCurrency(product.sellingPrice)}</td>
                  <td>
                    <span style="padding: 4px 8px; border-radius: 4px; background-color: ${product.status === 'active' ? '#d4edda' : '#f8d7da'}; color: ${product.status === 'active' ? '#155724' : '#721c24'};">
                      ${product.status}
                    </span>
                  </td>
                  <td style="width: 150px;">
                    <div class="action-buttons">
                      <button class="btn-sm" onclick="editProduct('${product._id}')">Edit</button>
                      <button class="btn-sm btn-danger" onclick="deleteProduct('${product._id}')">Delete</button>
                    </div>
                  </td>
                </tr>
              `;
            });
            tbody += '</tbody></table>';
            html = html.replace('<tbody></tbody></table>', tbody);
          }

          document.getElementById('productsTable').innerHTML = html;
        } else {
          document.getElementById('productsTable').innerHTML =
            '<p style="text-align: center; padding: 2rem;">No products found</p>';
        }
      } catch (error) {
        UIManager.showAlert('Failed to load products', 'danger');
      }
    }

    function openAddProductModal() {
      currentEditProductId = null;
      document.getElementById('modalTitle').textContent = 'Add New Product';
      UIManager.clearForm('productForm');
      UIManager.showModal('productModal');
    }

    async function editProduct(productId) {
      try {
        const response = await apiService.getProductById(productId);
        if (response.success) {
          const product = response.product;
          currentEditProductId = productId;

          document.getElementById('modalTitle').textContent = 'Edit Product';
          document.getElementById('productName').value = product.productName;
          document.getElementById('productCode').value = product.productCode;
          document.getElementById('category').value = product.category;
          document.getElementById('description').value = product.description || '';
          document.getElementById('purchasePrice').value = product.purchasePrice;
          document.getElementById('sellingPrice').value = product.sellingPrice;
          document.getElementById('minStock').value = product.minStock;
          document.getElementById('unit').value = product.unit;

          if (product.supplier) {
            document.getElementById('supplierName').value = product.supplier.name || '';
            document.getElementById('supplierEmail').value = product.supplier.email || '';
          }

          UIManager.showModal('productModal');
        }
      } catch (error) {
        UIManager.showAlert('Failed to load product', 'danger');
      }
    }

    async function deleteProduct(productId) {
      if (!confirm('Are you sure you want to delete this product?')) return;

      try {
        const response = await apiService.deleteProduct(productId);
        if (response.success) {
          UIManager.showAlert('Product deleted successfully', 'success');
          await loadProducts();
        }
      } catch (error) {
        UIManager.showAlert(error.message || 'Failed to delete product', 'danger');
      }
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = UIManager.getFormData('productForm');
      const supplier = {
        name: formData.supplierName,
        email: formData.supplierEmail,
      };

      const productData = {
        productName: formData.productName,
        productCode: formData.productCode,
        category: formData.category,
        description: formData.description,
        purchasePrice: parseFloat(formData.purchasePrice),
        sellingPrice: parseFloat(formData.sellingPrice),
        minStock: parseInt(formData.minStock),
        unit: formData.unit,
        supplier,
      };

      try {
        let response;
        if (currentEditProductId) {
          response = await apiService.updateProduct(currentEditProductId, productData);
        } else {
          response = await apiService.createProduct(productData);
        }

        if (response.success) {
          UIManager.showAlert(
            currentEditProductId ? 'Product updated successfully' : 'Product created successfully',
            'success'
          );
          UIManager.hideModal('productModal');
          await loadProducts();
        }
      } catch (error) {
        UIManager.showAlert(error.message || 'Failed to save product', 'danger');
      }
    });

    function handleLogout() {
      if (confirm('Are you sure you want to logout?')) {
        AuthManager.logout();
      }
    }
  </script>
</body>
</html>
